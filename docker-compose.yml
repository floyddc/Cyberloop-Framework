services:
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: cyberresponse
      POSTGRES_PASSWORD: cyberresponse
      POSTGRES_DB: knowledge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberresponse -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  rag-service:
    build:
      context: .
      dockerfile: RAG/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-cyberresponse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberresponse}
      POSTGRES_KNOWLEDGE_DB: knowledge
      KNOWLEDGE_DIR: /app/knowledge
      CACHE_DIR: /models
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./knowledge/indices:/app/knowledge/indices
      - rag-model-cache:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped

volumes:
  pgdata:
  rag-model-cache:
